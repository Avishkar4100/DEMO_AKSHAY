<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" />
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hospital cross -->
  <rect x="75" y="45" width="50" height="110" rx="8" fill="white" />
  <rect x="45" y="75" width="110" height="50" rx="8" fill="white" />
  <!-- Inner cross accent -->
  <rect x="82" y="52" width="36" height="96" rx="5" fill="url(#grad)" />
  <rect x="52" y="82" width="96" height="36" rx="5" fill="url(#grad)" />
</svg>
